<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <!-- ✝ Cross — primary Christian symbol -->
  <symbol id="cross" viewBox="0 0 40 64">
    <rect x="17" y="0"  width="6" height="64" rx="3" fill="currentColor"/>
    <rect x="0"  y="18" width="40" height="6"  rx="3" fill="currentColor"/>
  </symbol>

  <!-- 🕊 Dove — peace, Holy Spirit -->
  <symbol id="dove" viewBox="0 0 64 56">
    <path fill="currentColor" d="
      M52 8 C48 4 40 4 34 8 L22 16 C18 18 14 18 10 16
      C6 14 4 10 6 6 C8 2 14 0 20 2 L26 4
      C22 8 22 14 26 16 L34 20
      C36 14 42 10 48 12 L52 8 Z
    "/>
    <ellipse fill="currentColor" cx="32" cy="36" rx="16" ry="12" opacity="0.85"/>
    <path fill="currentColor" d="M24 44 L16 56 L32 50 Z" opacity="0.9"/>
    <circle fill="currentColor" cx="28" cy="30" r="2.5" opacity="0.6"/>
  </symbol>

  <!-- 💍 Rings — unity, covenant -->
  <symbol id="rings" viewBox="0 0 72 36">
    <circle cx="24" cy="18" r="14" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <circle cx="48" cy="18" r="14" fill="none" stroke="currentColor" stroke-width="3.5"/>
  </symbol>

  <!-- 🌿 Olive branch — peace, blessing -->
  <symbol id="olive" viewBox="0 0 64 48">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      d="M8 44 Q24 32 32 16 Q40 4 56 4"/>
    <ellipse fill="currentColor" cx="20" cy="36" rx="7" ry="4" transform="rotate(-30 20 36)" opacity="0.8"/>
    <ellipse fill="currentColor" cx="32" cy="26" rx="7" ry="4" transform="rotate(-20 32 26)" opacity="0.8"/>
    <ellipse fill="currentColor" cx="44" cy="16" rx="7" ry="4" transform="rotate(-10 44 16)" opacity="0.8"/>
  </symbol>

  <!-- ✨ Star / ornament — decorative accent -->
  <symbol id="star-ornament" viewBox="0 0 24 24">
    <path fill="currentColor" d="
      M12 0 L13.2 10.8 L24 12 L13.2 13.2 L12 24 L10.8 13.2 L0 12 L10.8 10.8 Z
    "/>
  </symbol>

</svg>
