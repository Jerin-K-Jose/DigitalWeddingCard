<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Invitation</title>

<!-- FONT LINKS: swap per theme -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<!-- THEME PACK: swap this line only, to reskin -->
<link rel="stylesheet" href="themes/christian-classic.css">
<!-- CORE: never touch per client -->
<link rel="stylesheet" href="core/base.css">
</head>
<body>

<div class="petal-layer" id="petals"></div>
<button id="audioToggle" aria-label="Toggle music" onclick="window.WeddingAudio && window.WeddingAudio.toggleMute()">♪</button>

<div id="gate">
  <div class="envelope" id="envelope" role="button" aria-label="Open invitation">
    <div class="env-body"></div>
    <div class="env-flap"></div>
    <div class="seal" id="cfg-monogram-seal"></div>
  </div>
  <div class="gate-hint">Tap to open</div>
</div>

<main class="scene">

<section id="hero" class="section" data-parallax>
  <div class="depth-bg" data-speed="-0.15" style="background:radial-gradient(circle at 30% 20%,rgba(217,195,154,.18),transparent 55%)"></div>
  <div class="depth-mid" data-speed="-0.3" style="background:radial-gradient(circle at 75% 75%,rgba(176,138,78,.15),transparent 50%)"></div>
  <div class="eyebrow reveal" id="cfg-hero-eyebrow"></div>
  <h1 class="reveal"><span id="cfg-bride"></span><span class="amp">&amp;</span><span id="cfg-groom"></span></h1>
  <div class="divider reveal"></div>
  <div class="date reveal" id="cfg-date"></div>
</section>

<section class="section light">
  <div class="eyebrow reveal" id="cfg-story-eyebrow"></div>
  <h2 class="reveal serif" style="font-size:clamp(1.6rem,5vw,2.4rem);font-weight:500;margin:.5rem 0 1.2rem" id="cfg-story-heading"></h2>
  <p class="lead reveal" id="cfg-story-text"></p>
  <div class="story-grid reveal"><div class="tilt"></div><div class="tilt"></div><div class="tilt"></div></div>
</section>

<section class="section tint" data-parallax>
  <div class="depth-bg" data-speed="-0.2" style="background:radial-gradient(circle at 50% 30%,rgba(110,42,53,.08),transparent 55%)"></div>
  <p class="scripture reveal" id="cfg-scripture-text"></p>
  <cite class="reveal" id="cfg-scripture-ref" style="font-style:normal;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:.6rem;display:block"></cite>
</section>

<section class="section light">
  <div class="eyebrow reveal" id="cfg-invite-eyebrow"></div>
  <p class="lead reveal" style="margin-top:1rem" id="cfg-invite-text"></p>
</section>

<section class="section tint">
  <div class="eyebrow reveal">The Day</div>
  <h2 class="reveal serif" style="font-size:clamp(1.6rem,5vw,2.2rem);font-weight:500;margin:.5rem 0 1.8rem">Order of Celebration</h2>
  <div class="timeline reveal" id="cfg-timeline"></div>
</section>

<section class="section light">
  <div class="eyebrow reveal">Getting There</div>
  <div class="venues reveal" style="margin-top:1.6rem" id="cfg-venues"></div>
</section>

<section class="section tint">
  <div class="eyebrow reveal">Moments</div>
  <div class="gallery reveal" style="margin-top:1.6rem" id="cfg-gallery"></div>
</section>

<section class="section light">
  <div class="eyebrow reveal">Counting Down</div>
  <div class="countdown reveal" id="countdown">
    <div class="cd-unit"><div class="cd-num" id="cd-d">--</div><div class="cd-label">Days</div></div>
    <div class="cd-unit"><div class="cd-num" id="cd-h">--</div><div class="cd-label">Hours</div></div>
    <div class="cd-unit"><div class="cd-num" id="cd-m">--</div><div class="cd-label">Mins</div></div>
  </div>
</section>

<section class="section tint">
  <div class="eyebrow reveal">Kindly Respond</div>
  <h2 class="reveal serif" style="font-size:clamp(1.6rem,5vw,2.2rem);font-weight:500;margin:.5rem 0 1.6rem">RSVP</h2>
  <form class="rsvp-form reveal" id="rsvpForm">
    <div class="field"><label>Full Name</label><input type="text" required></div>
    <div class="field"><label>Number of Guests</label><input type="number" min="1" max="6" value="1" required></div>
    <div class="field"><label>Will you attend?</label><select><option>Joyfully accepts</option><option>Regretfully declines</option></select></div>
    <div class="field"><label>Message for the couple</label><textarea rows="3"></textarea></div>
    <button class="btn" type="submit">Send RSVP</button>
  </form>
</section>

<section class="section" id="thanks" data-parallax>
  <div class="depth-bg" data-speed="-0.15" style="background:radial-gradient(circle at 25% 70%,rgba(217,195,154,.14),transparent 55%)"></div>
  <div class="eyebrow reveal">With Gratitude</div>
  <h2 class="reveal" style="font-family:var(--font-display);font-style:italic;font-weight:400;font-size:clamp(1.8rem,6vw,2.6rem);margin:.6rem 0" id="cfg-thanks-heading"></h2>
  <div class="divider reveal"></div>
  <p class="lead reveal" style="color:var(--gold-soft)" id="cfg-thanks-text"></p>
  <div class="share-row reveal"><button aria-label="Share">↗</button><button aria-label="Call">☏</button></div>
</section>

</main>

<footer id="cfg-footer">Made with love</footer>

<!-- LOAD ORDER MATTERS: config -> audio -> render -> interactions -->
<script src="config/wedding.config.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/render.js"></script>
<script src="engine/interactions.js"></script>
</body>
</html>
