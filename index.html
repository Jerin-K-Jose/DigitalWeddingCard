<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b08">
  <meta name="color-scheme" content="dark">

  <!-- Primary meta (overwritten by JS from config) -->
  <title>Wedding Invitation</title>
  <meta name="description" content="A premium digital wedding invitation">
  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Wedding Invitation">
  <meta property="og:description" content="You are cordially invited.">
  <meta property="og:image"       content="">
  <meta property="og:url"         content="">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Wedding Invitation">
  <meta name="twitter:description" content="You are cordially invited.">
  <meta name="twitter:image"       content="">

  <!-- Google Fonts preconnect (for typography pack) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- ═══════════════════════════════════════════════════════
       CRITICAL CSS — Inlined for zero render-blocking.
       Only above-the-fold Scene 01 styles live here.
       Full design tokens & layout loaded by pack-loader.js.
       ═══════════════════════════════════════════════════════ -->
  <style>
    /* ── Instant reset ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Page base ─────────────────────────────────────────── */
    html, body {
      width: 100%;
      height: 100%;
      background: #0d0b08;
      color: #f5e6c8;
      overflow: hidden; /* JS re-enables on scroll mode entry */
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* ── Particle Canvas ───────────────────────────────────── */
    #particle-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* ── Scene cover base ──────────────────────────────────── */
    .scene-cover {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 800ms cubic-bezier(0.45, 0.05, 0.55, 0.95);
    }
    .scene-cover.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Pre-scroll layer ──────────────────────────────────── */
    #pre-scroll-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
    }

    /* ── Scene 01: Loading ─────────────────────────────────── */
    #scene-loading {
      opacity: 1; /* Visible immediately — no JS needed for first frame */
      pointer-events: none;
      background: transparent;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      will-change: opacity;
    }

    /* Cross — the primary symbol */
    .loading-cross {
      position: relative;
      width: 40px;
      height: 60px;
    }

    .loading-cross svg {
      width: 100%;
      height: 100%;
      fill: #c9a84c;
      filter: drop-shadow(0 0 14px rgba(201, 168, 76, 0.40));
      /* Step 1: appear */
      animation:
        cross-appear  1.0s cubic-bezier(0.0, 0.0, 0.2, 1) 0.2s both,
        cross-breathe 3.2s ease-in-out 1.4s infinite;
    }

    @keyframes cross-appear {
      from { opacity: 0; transform: scale(0.88) translateY(8px); }
      to   { opacity: 0.75; transform: scale(1) translateY(0); }
    }

    @keyframes cross-breathe {
      0%, 100% { transform: scale(1);    opacity: 0.72; filter: drop-shadow(0 0 12px rgba(201,168,76,0.36)); }
      50%       { transform: scale(1.06); opacity: 0.95; filter: drop-shadow(0 0 20px rgba(201,168,76,0.58)); }
    }

    /* Ambient glow ring behind cross */
    .loading-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(ellipse,
        rgba(201,168,76,0.10) 0%,
        rgba(201,168,76,0.04) 40%,
        transparent 70%
      );
      transform: translate(-50%, -50%);
      animation: glow-pulse 3.2s ease-in-out 1.4s infinite;
      pointer-events: none;
    }

    @keyframes glow-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1);    opacity: 0.6; }
      50%       { transform: translate(-50%, -50%) scale(1.35); opacity: 1;   }
    }

    /* ── Light burst overlay ───────────────────────────────── */
    #light-burst {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center,
        rgba(255,255,255,0.96) 0%,
        rgba(245,230,200,0.65) 25%,
        rgba(201,168,76,0.15) 55%,
        transparent 72%
      );
      pointer-events: none;
      z-index: 400;
      opacity: 0;
      transition: opacity 120ms ease-out;
    }
    #light-burst.active { opacity: 1; }

    /* ── UI Chrome ─────────────────────────────────────────── */
    #ui-chrome {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    #progress-bar {
      position: absolute;
      top: 0; left: 0;
      height: 1.5px;
      width: 0%;
      background: linear-gradient(90deg,
        #8a6e2a, #c9a84c, #f0d080
      );
      box-shadow: 0 0 8px rgba(201,168,76,0.55);
      opacity: 0;
      pointer-events: none;
    }

    /* ── Reduced motion ────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .loading-cross svg {
        animation: cross-appear 0.01ms both;
        opacity: 0.75;
      }
      .loading-glow  { animation: none; }
      #particle-canvas { display: none; }
    }
  </style>
</head>

<body>

  <div id="app">

    <!-- ╔═════════════════════════════════════════════════════╗
         ║  LAYER 0: Particle Canvas (GPU composited)          ║
         ╚═════════════════════════════════════════════════════╝ -->
    <canvas
      id="particle-canvas"
      aria-hidden="true"
      role="presentation">
    </canvas>

    <!-- Light burst overlay (used for Scene 03 Hero entry) -->
    <div id="light-burst" aria-hidden="true"></div>

    <!-- ╔═════════════════════════════════════════════════════╗
         ║  LAYER 1: Pre-scroll (Scenes 01–02, fixed)          ║
         ╚═════════════════════════════════════════════════════╝ -->
    <div id="pre-scroll-layer">

      <!-- ─── Scene 01: Loading ─────────────────────────────── -->
      <section
        id="scene-loading"
        class="scene-cover active"
        role="status"
        aria-label="Loading your wedding invitation"
        aria-live="polite">

        <div class="loading-content">
          <!-- Ambient glow ring -->
          <div class="loading-cross" aria-hidden="true">
            <div class="loading-glow"></div>
            <!-- Cross SVG — inline for zero-latency render -->
            <svg
              viewBox="0 0 40 60"
              xmlns="http://www.w3.org/2000/svg"
              focusable="false"
              aria-hidden="true">
              <!-- Vertical beam -->
              <rect x="17" y="0"  width="6" height="60" rx="3"/>
              <!-- Horizontal beam -->
              <rect x="0"  y="18" width="40" height="6"  rx="3"/>
            </svg>
          </div>
        </div>

      </section>

      <!-- ─── Scene 02: Envelope (populated by scene-envelope.js) ─ -->
      <section
        id="scene-envelope"
        class="scene-cover"
        role="main"
        aria-label="Wedding invitation envelope"
        aria-hidden="true">
        <!-- scene-envelope.js injects content here -->
      </section>

    </div>

    <!-- ╔═════════════════════════════════════════════════════╗
         ║  LAYER 2: Scroll Experience (Scenes 03–10)          ║
         ╚═════════════════════════════════════════════════════╝ -->
    <main
      id="scroll-experience"
      hidden
      aria-hidden="true">
      
      <!-- 03. Hero / Announcement -->
      <section id="scene-hero" class="scene"></section>
      
      <!-- 04. The Story / Tagline -->
      <section id="scene-story" class="scene"></section>
      
      <!-- 05. Liturgy / Scripture -->
      <section id="scene-liturgy" class="scene"></section>
      
      <!-- 06. Timeline / Details -->
      <section id="scene-timeline" class="scene"></section>
      
      <!-- 07. Venue & Maps -->
      <section id="scene-venue" class="scene"></section>
      
      <!-- 08. RSVP System -->
      <section id="scene-rsvp" class="scene"></section>
      
      <!-- 09. Closing -->
      <section id="scene-closing" class="scene"></section>

    </main>

    <!-- ╔═════════════════════════════════════════════════════╗
         ║  LAYER 3: UI Chrome (fixed, always on top)          ║
         ╚═════════════════════════════════════════════════════╝ -->
    <div id="ui-chrome" aria-hidden="true">

      <!-- Scroll progress indicator -->
      <div
        id="progress-bar"
        role="progressbar"
        aria-valuenow="0"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-label="Scroll progress">
      </div>

      <!-- Audio toggle (shown after first interaction) -->
      <button
        id="audio-toggle"
        class="btn"
        aria-label="Enable music"
        aria-pressed="false"
        hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        </svg>
      </button>

      <!-- Language switcher (shown when multi-language enabled) -->
      <div id="language-switcher" aria-label="Language selector" hidden>
        <!-- Populated by i18n.js -->
      </div>

    </div>

  </div><!-- /#app -->

  <!-- ═══════════════════════════════════════════════════════
       Bootstrap — ES Module
       ═══════════════════════════════════════════════════════ -->
  <script type="module" src="/src/main.js"></script>

</body>
</html>
